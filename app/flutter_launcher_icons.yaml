# Regenerate all app icons with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/icon_square.png"
  android: "ic_launcher"
  adaptive_icon_background: "#1F3F9E"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/brand/logo.png"
    background_color: "#1F3F9E"
    theme_color: "#1F3F9E"
  windows:
    generate: true
    image_path: "assets/brand/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/brand/icon_macos.png"
