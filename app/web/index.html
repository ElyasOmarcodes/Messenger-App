<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
  <!-- Replaced by `flutter build web --base-href /path/` when hosted in a sub-folder. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Paigham — the Afghan messenger. پیغام: د افغانانو خپل پیغام رسان">
  <meta name="theme-color" content="#1F3F9E">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Paigham">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Paigham · پیغام</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #1F3F9E; }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #3D63D6, #1F3F9E 55%, #142A6B);
      transition: opacity .3s ease;
    }
    #splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 14px 40px rgba(0,0,0,.35); }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="Paigham"></div>
  <script>
    // Hide the splash as soon as Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
