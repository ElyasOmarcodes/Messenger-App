# Builds Paigham for every platform from the one Flutter/Dart codebase in app/
# and publishes the files as a GitHub Release you can download:
#
#   Android  -> .apk (install directly) and .aab (for Google Play)
#   iOS      -> unsigned .ipa (needs an Apple developer account to sign/install)
#   Windows  -> .zip with Paigham.exe
#   macOS    -> .zip with Paigham.app
#   Linux    -> .tar.gz
#   Web      -> .zip of the static site (optionally deployed to GitHub Pages)
#
# Runs on every push, on pull requests, on "v*" tags (official release) and by hand
# from the Actions tab ("Run workflow").

name: Build Paigham

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  # Server address: Settings > Secrets and variables > Actions > Variables
  # (SUPABASE_URL, SUPABASE_ANON_KEY). The anon key is public by design.
  SERVER: --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}

defaults:
  run:
    working-directory: app
    shell: bash

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - id: v
        run: echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (APK + AAB)
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Optional: a fixed signing key so new builds install over old ones.
      # Add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Without them the debug key is used.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/paigham.jks"
            echo "PAIGHAM_KEYSTORE=$RUNNER_TEMP/paigham.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          PAIGHAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PAIGHAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PAIGHAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }} $SERVER
          flutter build appbundle --release --build-number=${{ github.run_number }} $SERVER
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/Paigham-$VERSION-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "../dist/Paigham-$VERSION-android.aab"
          # Smaller per-CPU APKs (about a third of the size) for slow connections
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} $SERVER
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../dist/Paigham-$VERSION-android-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "../dist/Paigham-$VERSION-android-armv7.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: paigham-android
          path: dist/*

  web:
    name: Web
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --no-wasm-dry-run $SERVER
          mkdir -p ../dist
          (cd build/web && zip -qr "../../../dist/Paigham-$VERSION-web.zip" .)
          # Second build for GitHub Pages, which serves the site from /<repo>/
          flutter build web --release --no-web-resources-cdn --no-wasm-dry-run \
            --base-href "/${{ github.event.repository.name }}/" -o ../pages $SERVER
      - uses: actions/upload-artifact@v4
        with:
          name: paigham-web
          path: dist/*
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: |
          flutter pub get
          flutter build windows --release --build-number=${{ github.run_number }} $SERVER
          mkdir -p ../dist
          cd build/windows/x64/runner/Release
          7z a -tzip "../../../../../../dist/Paigham-$VERSION-windows-x64.zip" . > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: paigham-windows
          path: dist/*

  linux:
    name: Linux
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop toolchain
        run: sudo apt-get update -y && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: |
          flutter pub get
          flutter build linux --release --build-number=${{ github.run_number }} $SERVER
          mkdir -p ../dist
          tar -czf "../dist/Paigham-$VERSION-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: paigham-linux
          path: dist/*

  macos:
    name: macOS
    needs: test
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: |
          flutter pub get
          flutter build macos --release --build-number=${{ github.run_number }} $SERVER
          mkdir -p ../dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/Paigham.app "../dist/Paigham-$VERSION-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: paigham-macos
          path: dist/*

  ios:
    name: iOS (unsigned)
    needs: test
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }} $SERVER
          mkdir -p ../dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "../dist/Paigham-$VERSION-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: paigham-ios
          path: dist/*

  release:
    name: Publish release
    needs: [test, android, web, windows, linux, macos, ios]
    # Publish whatever built successfully, as long as Android did.
    if: always() && github.event_name != 'pull_request' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: paigham-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
        working-directory: .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Paigham {0}', github.ref_name) || format('Paigham {0} (build {1})', needs.test.outputs.version, github.run_number) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: dist/*
          body: |
            Automatic build of commit ${{ github.sha }} on `${{ github.ref_name }}`.

            | File | Platform |
            |---|---|
            | `*-android-arm64.apk` | Most Android phones (smallest download, ~20 MB) |
            | `*-android-armv7.apk` | Older 32-bit Android phones |
            | `*-android.apk` | Any Android phone (all CPU types in one, larger) |
            | `*-android.aab` | Google Play upload |
            | `*-windows-x64.zip` | Windows 10/11: unzip and run `Paigham.exe` |
            | `*-macos.zip` | macOS: unzip and open `Paigham.app` |
            | `*-linux-x64.tar.gz` | Linux: extract and run `./paigham` |
            | `*-web.zip` | Static website: upload to any web host |
            | `*-ios-unsigned.ipa` | iPhone: must be signed with an Apple developer account first |

  pages:
    name: Deploy web to GitHub Pages
    needs: web
    # Turn on with: Settings > Pages > Source: "GitHub Actions", then
    # Settings > Secrets and variables > Actions > Variables: DEPLOY_PAGES = true
    if: github.event_name == 'push' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
