# coturn for Paigham calls (relay for phones behind carrier NAT / CGNAT).
# Replace the two marked values. The secret must equal TURN_SECRET of the
# Supabase "turn" function.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET
realm=paigham
# the server's public IP (if it sits behind NAT, also: external-ip=PUBLIC/PRIVATE)
external-ip=CHANGE_ME_PUBLIC_IP
total-quota=300
bps-capacity=0
stale-nonce=600
# relay port range (open these UDP ports in the firewall)
min-port=49160
max-port=49999
# TLS (turns:) — certificates from Let's Encrypt for your domain
# cert=/etc/letsencrypt/live/turn.example.af/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.example.af/privkey.pem
no-multicast-peers
no-cli
# never relay into private networks of the server
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
